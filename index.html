<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inside Sales Team - West</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #ffffff; color: #1a1a1a; padding: 24px; max-width: 1400px; margin: 0 auto; line-height: 1.4; }
  .team-section h2 { font-size: 26px; font-weight: 600; color: #1a1a1a; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #0033a0; }
  .team-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 20px 14px; }
  .headshot-card { text-align: center; }
  .headshot-img-wrapper { width: 100%; aspect-ratio: 4 / 5; overflow: hidden; background: #e8e8e8; margin-bottom: 10px; }
  .headshot-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .headshot-name { font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 2px; line-height: 1.25; }
  .headshot-region { font-size: 12px; color: #666; font-weight: 400; }
  @media (max-width: 1200px) { .team-grid { grid-template-columns: repeat(5, 1fr); } }
  @media (max-width: 900px) { .team-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 700px) { .team-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 500px) { .team-grid { grid-template-columns: repeat(2, 1fr); } body { padding: 16px; } .team-section h2 { font-size: 20px; } .headshot-name { font-size: 15px; } }
</style>
</head>
<body>
  <section class="team-section">
    <h2>Inside Sales Team - West</h2>
    <div class="team-grid">
      <div class="headshot-card">
        <div class="headshot-img-wrapper"><img class="headshot-img" src="images/mandy-dennis.jpg" alt="Mandy Dennis"></div>
        <div class="headshot-name">Mandy Dennis</div>
      </div>
      <div class="headshot-card">
        <div class="headshot-img-wrapper"><img class="headshot-img" src="images/patrick-hattaway.jpg" alt="Patrick Hattaway"></div>
        <div class="headshot-name">Patrick Hattaway</div>
      </div>
      <div class="headshot-card">
        <div class="headshot-img-wrapper"><img class="headshot-img" src="images/cody-hill.jpg" alt="Cody Hill"></div>
        <div class="headshot-name">Cody Hill</div>
      </div>
      <div class="headshot-card">
        <div class="headshot-img-wrapper"><img class="headshot-img" src="images/clee-stubblefield.jpg" alt="Clee Stubblefield"></div>
        <div class="headshot-name">Clee Stubblefield</div>
      </div>
      <div class="headshot-card">
        <div class="headshot-img-wrapper"><img class="headshot-img" src="images/adam-schmoker.jpg" alt="Adam Schmoker"></div>
        <div class="headshot-name">Adam Schmoker</div>
      </div>
      <div class="headshot-card">
        <div class="headshot-img-wrapper"><img class="headshot-img" src="images/will-mcmurphy.jpg" alt="Will McMurphy"></div>
        <div class="headshot-name">Will McMurphy</div>
      </div>
      <div class="headshot-card">
        <div class="headshot-img-wrapper"><img class="headshot-img" src="images/nick-watts.jpg" alt="Nick Watts"></div>
        <div class="headshot-name">Nick Watts</div>
      </div>
      <div class="headshot-card">
        <div class="headshot-img-wrapper"><img class="headshot-img" src="images/kim-thorn-irvin.jpg" alt="Kim Thorn-Irvin"></div>
        <div class="headshot-name">Kim Thorn-Irvin</div>
      </div>
    </div>
  </section>
</body>
</html>
